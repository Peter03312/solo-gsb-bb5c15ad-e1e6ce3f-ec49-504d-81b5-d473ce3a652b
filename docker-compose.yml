services:
  db:
    image: postgres:16-alpine
    container_name: stowage-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stowage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stowage}
      POSTGRES_DB: ${POSTGRES_DB:-stowage}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - stowage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stowage} -d ${POSTGRES_DB:-stowage}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: stowage-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-stowage}:${POSTGRES_PASSWORD:-stowage}@db:5432/${POSTGRES_DB:-stowage}
      DB_STARTUP_TIMEOUT_SEC: "60"
    ports:
      - "${API_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  stowage-pgdata:
